[build-system]
requires = ["uv_build>=0.12.21, <0.14"]
build-backend = "uv_build"

[project]
name = "pysh_pythoner"
version = "0.1.3"
authors = [{ name = "Cade", email = "cadey.matignas@gmail.com" }]
description = 'coolguy038/pysh plugin for "A custom python REPL"'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pythoner>=0.1.0", "tomlkit>=0.1.0"]

[project.urls]
Homepage = "https://github.com/coolguy038/pysh-pythoner"


[project.scripts]
pysh-pythoner = "pysh_pythoner.cli:main"
